name: Deploy to GitHub Pages

on:
  # 推送到 main 或 master 分支时自动触发
  push:
    branches:
      - main
      - master
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 设置 GitHub Pages 部署所需的权限
# administration: write 用于首次运行时自动启用 Pages（enablement）
permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

# 同一时间只保留一个部署，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行自动启用 Pages（无需手动去 Settings 配置）
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite 默认输出目录
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4